<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QMS - BC6000 Series</title>
  <link rel="icon" href="./img/QMS1.jpg" type="image/png">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .section-title { margin-top: 20px; font-weight: bold; }
    button { margin: 5px; padding: 8px 15px; background: green; color: white; border: none; cursor: pointer; }
    button:hover { background: darkgreen; }
    .check-btn { background: blue; }
    .check-btn:hover { background: darkblue; }
  </style>
</head>
<body>
  <div  style="background-color: rgb(2, 2, 146); text-align: center;">
    <h2 style="margin: 0%; padding: 25px; padding-left: 50px; padding-top: 30px; padding-right: 50px; color: rgb(230, 230, 230);">K L E S DR.PRABHAKAR KORE HOSPITAL & MEDICAL RESEARCH CENTRE BELGAUM</h2>
    <!-- <h2 style="margin-bottom: 0%; margin-top: 0%;" >HI - TECH LABORATORY HAEMATOLOGY / CLINICAL PATHOLOGY DEPARTMENT</h2> -->
  </div>
  <div  style="background-color: rgb(2, 2, 146); margin-top: 0.5%; text-align: center;">
    <h3 style="margin-bottom: 0%; margin-top: 0%; padding-bottom: 1%; padding-top: 1%; color: rgb(177, 250, 238);" >HI - TECH LABORATORY HAEMATOLOGY / CLINICAL PATHOLOGY DEPARTMENT</h3>
    
    <!-- <h2 style="padding-bottom: 25px;margin-bottom: 0%; text-align: center;">Select Form</h2> -->
  </div>
  <h2 style="text-align: center;">BC6000 Series</h2>
  

  <label>Select Date: </label>
  <input type="date" id="date" required>
  <button class="check-btn" onclick="checkEntry()">Check Entry</button>
  <button onclick="window.location.href='index.html'" style="color: whith; background-color: gray;">Back</button>
  <button onclick="submitForm()" style="position: relative;  margin-left:46%; padding-left: 25px; padding-right: 25px; font-size:medium;  ">Submit</button>
  <button id="sendAuthBtn" onclick="sendForAuthorization()"style=" padding-left: 25px; padding-right: 25px; font-size:medium;">Send for Authorization</button>
  

  <div id="tables"></div>











  <!-- Custom Modal for Alerts and Confirms -->  
  <script>

    document.addEventListener("DOMContentLoaded", () => {
      document.body.insertAdjacentHTML("beforeend", `
        <div id="customModal" style="
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0, 0, 0, 0.900);
            justify-content:center;
            align-items:center;
            z-index:1000;
        ">
          <div style="background:rgb(18, 28, 70); padding:20px; border-radius:8px; width:350px; text-align:center; font-size:14px;">
            <p id="modalMessage" style="color: rgb(214, 214, 214); font-size: larger;font-weight:400;">Message here...</p>
            <div style="margin-top:15px;">
              <button id="okBtn" style="background:green; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">OK</button>
              <button id="cancelBtn" style="background:gray; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">Cancel</button>
            </div>
          </div>
        </div>
      `);

      function showModal(message, isConfirm = false) {
        return new Promise(resolve => {
          const modal = document.getElementById("customModal");
          const msg = document.getElementById("modalMessage");
          const okBtn = document.getElementById("okBtn");
          const cancelBtn = document.getElementById("cancelBtn");

          msg.innerText = message;
          modal.style.display = "flex";
          cancelBtn.style.display = isConfirm ? "inline-block" : "none";

          okBtn.onclick = () => { modal.style.display = "none"; resolve(true); };
          cancelBtn.onclick = () => { modal.style.display = "none"; resolve(false); };
        });
      }
      // Override default alert & confirm
      window.alert = function(message) {
        return showModal(message, false);
      };
      window.confirm = function(message) {
        return showModal(message, true);
      };
    });



















    let activities = [];

    async function loadActivities() {
      const res = await fetch("http://10.0.9.188:5000/bc6000/activities");
      activities = await res.json();
    }

    function renderTables(logs) {
      const categories = ["Daily", "Weekly", "Bi-Weekly"];
      let html = "";

      categories.forEach(cat => {
        html += `<div class="section-title">${cat} Maintenance</div>`;
        html += `<table><thead><tr><th>Activity</th><th>Done</th><th>Sign</th></tr></thead><tbody>`;
        activities.filter(a => a.category === cat).forEach(a => {
          const log = logs.find(l => l.activity_id === a.activity_id) || {};
          html += `
            <tr data-id="${a.activity_id}">
              <td>${a.activity_name}</td>
              <td><input type="checkbox" id="done_${a.activity_id}" ${log.done ? "checked" : ""}></td>
              <td><input type="text" id="sign_${a.activity_id}" value="${log.sign || ""}"></td>
            </tr>`;
        });
        html += `</tbody></table>`;
      });
      document.getElementById("tables").innerHTML = html;
    }

    async function checkEntry() {
      const date = document.getElementById("date").value;
      if (!date) return alert("Please select a date first.");

      await loadActivities();
      const res = await fetch(`http://10.0.9.188:5000/bc6000/logs/${date}`);
      const data = await res.json();

      if (res.status === 403 && data.locked) {
        alert(data.message);
        document.querySelectorAll("input,button").forEach(e => e.disabled = true);
        return;
      }

      renderTables(data.logs);
    }

    async function submitForm() {
      const date = document.getElementById("date").value;
      if (!date) return alert("Please select a date");

      const rows = document.querySelectorAll("#tables tr[data-id]");
      const logs = Array.from(rows).map(row => {
        const id = row.getAttribute("data-id");
        return {
          activity_id: id,
          done: document.getElementById(`done_${id}`).checked ? 1 : 0,
          sign: document.getElementById(`sign_${id}`).value
        };
      });

      const res = await fetch("http://10.0.9.188:5000/bc6000/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date, logs }),
        credentials: "include"
      });
      alert(await res.text());
    }

    async function sendForAuthorization() {
      const date = document.getElementById("date").value;
      if (!date) return alert("Please select a date first");
      const formName = "BC6000Series MAINTENANCE";

      const res = await fetch("http://10.0.9.188:5000/send-for-authorization", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ formName, date }),
        credentials: "include"
      });
      alert(await res.text());
    }

  </script>
</body>
</html>
