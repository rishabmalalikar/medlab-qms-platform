<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Employee Account</title>
  <link rel="icon" href="./img/QMS1.jpg" type="image/png" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }
    h2 {
      color: #004d80;
      margin-bottom: 15px;
    }
    input, select {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 95%;
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover { background: #0056b3; }
    .logout {
      background: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create New Employee</h2>

    <input type="text" id="name" placeholder="Employee Name" />
    <input type="text" id="EID" placeholder="Employee Email/ID" />
    <input type="password" id="password" placeholder="Password" />

    <label for="role"><b>Select Role:</b></label>
    <select id="role">
      <option value="employee">Employee</option>
      <option value="admin">Admin</option>
      <option value="authorizer">Authorizer</option>
    </select>

    <button onclick="createEmployee()">Create Employee</button>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <script>
     
  
    document.addEventListener("DOMContentLoaded", () => {
      document.body.insertAdjacentHTML("beforeend", `
        <div id="customModal" style="
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0, 0, 0, 0.900);
            justify-content:center;
            align-items:center;
            z-index:1000;
        ">
          <div style="background:rgb(18, 28, 70); padding:20px; border-radius:8px; width:350px; text-align:center; font-size:14px;">
            <p id="modalMessage" style="color: rgb(214, 214, 214); font-size: larger;font-weight:400;">Message here...</p>
            <div style="margin-top:15px;">
              <button id="okBtn" style="background:green; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">OK</button>
              <button id="cancelBtn" style="background:gray; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">Cancel</button>
            </div>
          </div>
        </div>
      `);

      function showModal(message, isConfirm = false) {
        return new Promise(resolve => {
          const modal = document.getElementById("customModal");
          const msg = document.getElementById("modalMessage");
          const okBtn = document.getElementById("okBtn");
          const cancelBtn = document.getElementById("cancelBtn");

          msg.innerText = message;
          modal.style.display = "flex";
          cancelBtn.style.display = isConfirm ? "inline-block" : "none";

          okBtn.onclick = () => { modal.style.display = "none"; resolve(true); };
          cancelBtn.onclick = () => { modal.style.display = "none"; resolve(false); };
        });
      }
      // Override default alert & confirm
      window.alert = function(message) {
        return showModal(message, false);
      };
      window.confirm = function(message) {
        return showModal(message, true);
      };
    });













    
    

    //  Create Employee Function
    async function createEmployee() {
      const name = document.getElementById('name').value.trim();
      const EID = document.getElementById('EID').value.trim();
      const password = document.getElementById('password').value.trim();
      const role = document.getElementById('role').value;

      if (!name || !EID || !password) return alert('Please fill in all fields.');

      const res = await fetch('http://10.0.9.188:5000/create-employee', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, EID, password, role })
      });

      if (res.ok) {
        alert(' Employee account created successfully!');
        document.getElementById('name').value = '';
        document.getElementById('EID').value = '';
        document.getElementById('password').value = '';
      } else {
        const msg = await res.text();
        alert(' ' + msg);
      }
    }

    //  Logout Function
    async function logout() {
  try {
    const res = await fetch("http://10.0.9.188:5000/logout", {
      method: "POST",
      credentials: "include",
    });

    if (res.ok) {
      //  Cookie cleared successfully
      window.location.href = "/login.html";
    } else {
      const msg = await res.text();
      alert("Logout failed: " + msg);
    }
  } catch (err) {
    console.error("Logout error:", err);
    alert("An error occurred while logging out.");
  }
}
  </script>
</body>
</html>
