<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMS Report</title>
    <link rel="icon" href="./img/QMS1.jpg" type="image/png">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        input, select { padding: 8px; margin: 5px; }
        button { margin: 10px 5px; padding: 8px 15px; border: none; cursor: pointer; color: white; }
        .fetch-btn { background: blue; }
        .fetch-btn:hover { background: darkblue; }
        .back-btn { background: gray; }
        .print-btn { background: green; }
    </style>
</head>
<body>
    <h1>QMS Reports</h1>

    <!-- Filter Section -->
    <div>
        <label for="formName">Form Name:</label>
        <select id="formName">
            <option value="">-- Select Form --</option>
            <option value="Daily Activity Checklist">Daily Activity Checklist</option>
            <option value="MICROSCOPE MAINTENANCE">MICROSCOPE MAINTENANCE</option>
            <option value="BC6000Series MAINTENANCE">BC6000Series MAINTENANCE</option>
            <option value="WRIGHTS STAIN">WRIGHTS STAIN</option>
            <option value="CENTRIFUGE MAINTENANCE">CENTRIFUGE MAINTENANCE</option>
            <option value="WATERBATH MAINTENANCE">WATERBATH MAINTENANCE</option>
            <option value="pH METER">pH METER</option>
            <option value="COBAS PRO INTEGRATED">COBAS PRO INTEGRATED</option>
            <option value="COBAS PURE INTEGRATED">COBAS PURE INTEGRATED</option>
        </select>

        <label for="fromDate">From Date:</label>
        <input type="date" id="fromDate">

        <label for="toDate">To Date:</label>
        <input type="date" id="toDate">

        <label for="authStatus">Status:</label>
        <select id="authStatus">
            <option value="">-- Select Status --</option>
            <option value="pending">Pending</option>
            <option value="authorized">Authorized</option>
        </select>

        <button class="fetch-btn" onclick="fetchReports()">Fetch Reports</button>
        <button class="back-btn" onclick="window.location.href='authorizer-dashboard.html'">Back</button>
        <button class="print-btn" onclick="window.print()">Print this page</button>
    </div>

    <!-- Reports Table -->
    <table id="reportsTable" style="display: none;">
        <thead>
            <tr>
                <th>Form Name</th>
                <th>Activity Date</th>
                <th>Created By</th>
                <th>Status</th>
                <th>Authorized By</th>
                <th>Authorized Date</th>
            </tr>
        </thead>
        <tbody id="reportsTableBody">
        </tbody>
    </table>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
      document.body.insertAdjacentHTML("beforeend", `
        <div id="customModal" style="
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0, 0, 0, 0.900);
            justify-content:center;
            align-items:center;
            z-index:1000;
        ">
          <div style="background:rgb(18, 28, 70); padding:20px; border-radius:8px; width:350px; text-align:center; font-size:14px;">
            <p id="modalMessage" style="color: rgb(214, 214, 214); font-size: larger;font-weight:400;">Message here...</p>
            <div style="margin-top:15px;">
              <button id="okBtn" style="background:green; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">OK</button>
              <button id="cancelBtn" style="background:gray; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">Cancel</button>
            </div>
          </div>
        </div>
      `);

      function showModal(message, isConfirm = false) {
        return new Promise(resolve => {
          const modal = document.getElementById("customModal");
          const msg = document.getElementById("modalMessage");
          const okBtn = document.getElementById("okBtn");
          const cancelBtn = document.getElementById("cancelBtn");

          msg.innerText = message;
          modal.style.display = "flex";
          cancelBtn.style.display = isConfirm ? "inline-block" : "none";

          okBtn.onclick = () => { modal.style.display = "none"; resolve(true); };
          cancelBtn.onclick = () => { modal.style.display = "none"; resolve(false); };
        });
      }
      // Override default alert & confirm
      window.alert = function(message) {
        return showModal(message, false);
      };
      window.confirm = function(message) {
        return showModal(message, true);
      };
    });

    async function fetchReports() {
    const formName = document.getElementById("formName").value;
    const fromDate = document.getElementById("fromDate").value;
    const toDate = document.getElementById("toDate").value;
    const authStatus = document.getElementById("authStatus").value;

    // Validate inputs
    if (!formName && !fromDate && !toDate && !authStatus) {
        alert("Please select at least one filter.");
        return;
    }

    try {
        const queryParams = new URLSearchParams({
            formName,
            fromDate,
            toDate,
            authStatus
        });

        const response = await fetch(`http://10.0.9.188:5000/reports?${queryParams.toString()}`);
        if (!response.ok) {
            const errorMessage = await response.text();
            alert(errorMessage);
            return;
        }

        const data = await response.json();
        const tableBody = document.getElementById("reportsTableBody");
        tableBody.innerHTML = "";

        if (data.length === 0) {
            alert("No records found.");
            document.getElementById("reportsTable").style.display = "none";
            return;
        }

        data.forEach((row) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.FormName}</td>
                <td>${formatDate(row.ActivityDate)}</td>
                <td>${row.CreatedBy || "N/A"}</td>
                <td>${row.AuthStatus}</td>
                <td>${row.AuthBy || "N/A"}</td>
                <td>${row.AuthDate ? formatDate(row.AuthDate) : "N/A"}</td>
            `;
            tableBody.appendChild(tr);
        });

        document.getElementById("reportsTable").style.display = "table";
    } catch (error) {
        console.error("Error fetching reports:", error);
        alert("Failed to fetch reports. Please try again later.");
    }
}

// Helper function to format dates to YYYY-MM-DD
function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toISOString().slice(0, 10); // Extract YYYY-MM-DD
}

    </script>
</body>
</html>
