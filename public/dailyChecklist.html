  <!-- Custom Modal for Alerts and Confirms -->
  <script>
    
  
    document.addEventListener("DOMContentLoaded", () => {
      document.body.insertAdjacentHTML("beforeend", `
        <div id="customModal" style="
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0, 0, 0, 0.900);
            justify-content:center;
            align-items:center;
            z-index:1000;
        ">
          <div style="background:rgb(18, 28, 70); padding:20px; border-radius:8px; width:350px; text-align:center; font-size:14px;">
            <p id="modalMessage" style="color: rgb(214, 214, 214); font-size: larger;font-weight:400;">Message here...</p>
            <div style="margin-top:15px;">
              <button id="okBtn" style="background:green; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">OK</button>
              <button id="cancelBtn" style="background:gray; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">Cancel</button>
            </div>
          </div>
        </div>
      `);

      function showModal(message, isConfirm = false) {
        return new Promise(resolve => {
          const modal = document.getElementById("customModal");
          const msg = document.getElementById("modalMessage");
          const okBtn = document.getElementById("okBtn");
          const cancelBtn = document.getElementById("cancelBtn");

          msg.innerText = message;
          modal.style.display = "flex";
          cancelBtn.style.display = isConfirm ? "inline-block" : "none";

          okBtn.onclick = () => { modal.style.display = "none"; resolve(true); };
          cancelBtn.onclick = () => { modal.style.display = "none"; resolve(false); };
        });
      }
      // Override default alert & confirm
      window.alert = function(message) {
        return showModal(message, false);
      };
      window.confirm = function(message) {
        return showModal(message, true);
      };
    });

    














    let activities = [];

    // Load activities initially
    fetch("http://10.0.9.188:5000/activities")
      .then(res => res.json())
      .then(data => {
        activities = data;
        const tbody = document.querySelector("#activityTable tbody");
        tbody.innerHTML = "";
        data.forEach(a => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${a.ActivityName}</td>
            <td><input type="checkbox" id="status_${a.ActivityID}"></td>
            <td><input type="text" id="remark_${a.ActivityID}" placeholder="Enter remark"></td>
            `;
          tbody.appendChild(row);
        });
        console.log(" Rendered activities:", data.map(a => a.id));
      });





// Function to check if entry exists for a date
// Updated checkEntry() function
async function checkEntry() {
  const date = document.getElementById("date").value;
  if (!date) {
    alert("Please select a date first.");
    return;
  }

  console.log(" Checking entry for:", date);

  // Reset all fields first
  activities.forEach(a => {
    document.getElementById(`status_${a.ActivityID}`).checked = false;
    document.getElementById(`remark_${a.ActivityID}`).value = "";
  });

  try {
    const res = await fetch(`http://10.0.9.188:5000/logs/${date}`);
    const data = await res.json();

    //  Handle locked form
    if (res.status === 403 || data.locked) {
      alert(data.message || " This form is locked and cannot be edited.");
      document.querySelectorAll("input, textarea, select, button").forEach(el => {
        el.disabled = true;
      });
      return;
    }

    //  If form editable
    const logs = data.logs || data;
    if (!logs || logs.length === 0) {
      alert("No entry found for this date. You can submit a new one.");
      return;
    }

    alert(data.message || " Found entry for this date. Prefilling form...");

    logs.forEach(log => {
      const checkbox = document.getElementById(`status_${log.ActivityID}`);
      const remark = document.getElementById(`remark_${log.ActivityID}`);
      if (checkbox) checkbox.checked = log.Status === true || log.Status === 1;
      if (remark) remark.value = log.Remark || "";
    });

  } catch (err) {
    console.error(" Error fetching logs:", err);
    alert("Error fetching data from server.");
  }
}










// Submit form
let savedLogIds = []; // store all saved LogIDs

async function submitForm() {
  const date = document.getElementById("date").value;
  if (!date) {
    alert("Please select a date");
    return;
  }

  const logs = activities.map(a => ({
    activity_id: a.ActivityID,
    status: document.getElementById(`status_${a.ActivityID}`).checked ? 1 : 0,
    remark: document.getElementById(`remark_${a.ActivityID}`).value
  }));

  const res = await fetch("http://10.0.9.188:5000/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ date, logs }),
    credentials: "include"
  });

  const data = await res.json();

  if (res.ok) {
    savedLogIds = data.recordIds; // store array of LogIDs
    alert(" Form saved successfully.");
  } else {
    alert(" Error saving form.");
  }
}

async function sendForAuthorization() {
  const date = document.getElementById("date").value;
  if (!date) {
    return alert("Please select a date first.");
  }

  const confirmSend = await confirm("Are you sure you want to send this form for authorization?");
  if (!confirmSend) return;

  const formName = "Daily Activity Checklist";

  const res = await fetch("http://10.0.9.188:5000/send-for-authorization", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ formName, date })
  });

  const msg = await res.text();
  alert(msg);

  if (res.ok) {
    //  Lock form on success
    document.querySelectorAll("input, textarea, select, button").forEach(el => {
      if (el.id !== "date" && el.id !== "checkBtn") el.disabled = true;
    });
  }
}
