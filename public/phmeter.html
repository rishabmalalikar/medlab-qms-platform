<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QMS - pH Meter</title>
  <link rel="icon" href="./img/QMS1.jpg" type="image/png">
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; }
    h2 { text-align: center; margin-top: 10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f4f4f4; }
    input[type="text"] { width: 95%; }
    button { margin: 10px 5px; padding: 8px 15px; background: green; color: white; border: none; cursor: pointer; }
    button:hover { background: darkgreen; }
    .check-btn { background: blue; }
    .check-btn:hover { background: darkblue; }
  </style>
</head>
<body>
  <div  style="background-color: rgb(2, 2, 146); text-align: center;">
    <h2 style="margin: 0%; padding: 25px; padding-left: 50px; padding-top: 30px; padding-right: 50px; color: rgb(230, 230, 230);">K L E S DR.PRABHAKAR KORE HOSPITAL & MEDICAL RESEARCH CENTRE BELGAUM</h2>
  </div>

  <div  style="background-color: rgb(2, 2, 146); margin-top: 0.5%; text-align: center;">
    <h3 style="margin-bottom: 0%; margin-top: 0%; padding-bottom: 1%; padding-top: 1%; color: rgb(177, 250, 238);" >HI - TECH LABORATORY HAEMATOLOGY / CLINICAL PATHOLOGY DEPARTMENT</h3>
  </div>
  <h2 style="text-align: center;">pH Meter Daily Log</h2>

  <label>Select Date: </label>
  <input type="date" id="date" />

  <button class="check-btn" onclick="checkEntry()">Check Entry</button>
  <button onclick="window.history.back()" style="background: gray;">Back</button>
  <button onclick="submitForm()" style="position: relative;  margin-left:46%; padding-left: 25px; padding-right: 25px; font-size:medium;  ">Submit</button>
  <button id="sendAuthBtn" onclick="sendForAuthorization()"style=" padding-left: 25px; padding-right: 25px; font-size:medium;">Send for Authorization</button>

  <table id="logTable">
    <thead>
      <tr>
        <th>Sl. No.</th>
        <th>Instrument Name</th>
        <th>Self Test</th>
        <th>B. Calibration</th>
        <th>pH 4.0</th>
        <th>pH 7.0</th>
        <th>pH 9.0</th>
        <th>Tech. Sign</th>
        <th>Sup. Sign</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>pH Meter</td>
        <td><input type="text" id="self_test"></td>
        <td><input type="text" id="b_calibration"></td>
        <td><input type="checkbox" id="ph4"></td>
        <td><input type="checkbox" id="ph7"></td>
        <td><input type="checkbox" id="ph9"></td>
        <td><input type="text" id="tech_sign"></td>
        <td><input type="text" id="sup_sign"></td>
      </tr>
    </tbody>
  </table>

  <script>
     
  
    document.addEventListener("DOMContentLoaded", () => {
      document.body.insertAdjacentHTML("beforeend", `
        <div id="customModal" style="
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0, 0, 0, 0.900);
            justify-content:center;
            align-items:center;
            z-index:1000;
        ">
          <div style="background:rgb(18, 28, 70); padding:20px; border-radius:8px; width:350px; text-align:center; font-size:14px;">
            <p id="modalMessage" style="color: rgb(214, 214, 214); font-size: larger;font-weight:400;">Message here...</p>
            <div style="margin-top:15px;">
              <button id="okBtn" style="background:green; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">OK</button>
              <button id="cancelBtn" style="background:gray; color:white; padding:5px 15px; margin:5px; border:none; border-radius:4px;">Cancel</button>
            </div>
          </div>
        </div>
      `);

      function showModal(message, isConfirm = false) {
        return new Promise(resolve => {
          const modal = document.getElementById("customModal");
          const msg = document.getElementById("modalMessage");
          const okBtn = document.getElementById("okBtn");
          const cancelBtn = document.getElementById("cancelBtn");

          msg.innerText = message;
          modal.style.display = "flex";
          cancelBtn.style.display = isConfirm ? "inline-block" : "none";

          okBtn.onclick = () => { modal.style.display = "none"; resolve(true); };
          cancelBtn.onclick = () => { modal.style.display = "none"; resolve(false); };
        });
      }
      // Override default alert & confirm
      window.alert = function(message) {
        return showModal(message, false);
      };
      window.confirm = function(message) {
        return showModal(message, true);
      };
    });













    async function checkEntry() {
      const date = document.getElementById("date").value;
      if (!date) return alert("Please select a date first.");

      try {
        const res = await fetch(`http://10.0.9.188:5000/phmeter/${date}`);
        if (!res.ok) {
          const data = await res.json();
          alert(data.message);
          disableForm();
          return;
        }

        const logs = await res.json();
        if (logs.length > 0) {
          const log = logs[0];
          document.getElementById("self_test").value = log.self_test || "";
          document.getElementById("b_calibration").value = log.b_calibration || "";
          document.getElementById("ph4").checked = log.ph4;
          document.getElementById("ph7").checked = log.ph7;
          document.getElementById("ph9").checked = log.ph9;
          document.getElementById("tech_sign").value = log.tech_sign || "";
          document.getElementById("sup_sign").value = log.sup_sign || "";
          alert(" Data loaded successfully!");
        } else {
          clearForm();
          alert(" No entry found for this date.");
        }
      } catch (err) {
        console.error(" Error fetching data:", err);
        alert("Error fetching data from server.");
      }
    }

    async function submitForm() {
      const date = document.getElementById("date").value;
      if (!date) return alert("Please select a date first.");

      const log = {
        date,
        self_test: document.getElementById("self_test").value,
        b_calibration: document.getElementById("b_calibration").value,
        ph4: document.getElementById("ph4").checked,
        ph7: document.getElementById("ph7").checked,
        ph9: document.getElementById("ph9").checked,
        tech_sign: document.getElementById("tech_sign").value,
        sup_sign: document.getElementById("sup_sign").value
      };

      const res = await fetch("http://10.0.9.188:5000/phmeter/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(log)
      });

      const msg = await res.text();
      alert(msg);
    }

    async function sendForAuthorization() {
      const date = document.getElementById("date").value;
      if (!date) return alert("Please select a date first.");

      const formName = "pH METER";

      const res = await fetch("http://10.0.9.188:5000/send-for-authorization", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ formName, date }),
        credentials: "include"
      });

      const msg = await res.text();
      alert(msg);
      if (res.ok) disableForm();
    }

    function disableForm() {
      document.querySelectorAll("input, textarea, select, button").forEach(el => el.disabled = true);
    }

    function clearForm() {
      document.querySelectorAll("input[type='text']").forEach(el => el.value = "");
      document.querySelectorAll("input[type='checkbox']").forEach(el => el.checked = false);
    }


  </script>
</body>
</html>
